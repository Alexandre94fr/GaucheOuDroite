name: Build Release


on:
  push:
    branches:
      - main


jobs:
  Get-Game-Version:
    runs-on: windows-latest
    
    outputs:
      game-version: ${{ steps.game-version.outputs.version }}

    steps:
      - name: Getting the GitHub repository
        uses: actions/checkout@v6
      
      - name: Getting the game version
        id: game-version
        shell: pwsh
        run: |
          $gamePropertiesFilePath = "ProjectFiles\Shared\Constants\GameProperties.cs"

          $fileContent = Get-Content $gamePropertiesFilePath -Raw

          if ($fileContent -notmatch 'GAME_VERSION\s*=\s*"([^"]+)"')
          {
            Write-Error "ERROR: [Build_Release] Unable to retrieve GAME_VERSION from [$gamePropertiesFilePath]."
            exit 1
          }

          $gameVersion = $Matches[1]

          Write-Host "Game version: $gameVersion"

          "version=$gameVersion" >> $env:GITHUB_OUTPUT


  Build-BackEnd:
    runs-on: windows-latest

    steps:
      - name: Getting the GitHub repository
        uses: actions/checkout@v6
      
      - name: Installing .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publishing the BackEnd
        run: dotnet publish ProjectFiles\BackEnd\GaucheOuDroiteBackEnd\GaucheOuDroiteBackEnd.csproj --configuration Release --output Build\Server
              
      - name: Setting the JWT key
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}
        shell: pwsh
        run: |
          $configPath = "Build\Server\appsettings.Production.json"
        
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
        
          $config.JwtSettings.Key = $env:JWT_KEY
        
          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath
        
      - name: Uploading the BackEnd build
        uses: actions/upload-artifact@v6
        with:
          name: BackEnd-Build
          path: Build\Server


  Build-FrontEnd:
    needs: [Get-Game-Version]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - language: FRA
            branch: main

          - language: ENG
            branch: feat-EnglishVersion
  
    steps:
      - name: Getting the GitHub repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Caching Unity Library
        uses: actions/cache@v6
        with:
          path: ProjectFiles/FrontEnd/GaucheOuDroite/Library
          key: Library-GaucheOuDroite-StandaloneWindows64-${{ matrix.language }}
          restore-keys: |
            Library-GaucheOuDroite-StandaloneWindows64-
            Library-GaucheOuDroite-
            Library-

      - name: Building the Unity project
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL_ADRESS }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ProjectFiles/FrontEnd/GaucheOuDroite
          unityVersion: 6000.3.16f1
          targetPlatform: StandaloneWindows64
          buildsPath: Build
          buildName: GaucheOuDroite

      - name: Uploading the FrontEnd build
        uses: actions/upload-artifact@v6
        with:
          name: FrontEnd-Build-${{ needs.Get-Game-Version.outputs.game-version }}_${{ matrix.language }}
          path: Build/StandaloneWindows64
          

